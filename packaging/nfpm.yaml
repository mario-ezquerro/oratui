name: "ora-tui"
arch: "amd64"
platform: "linux"
version: "1.8.0"
release: "1"
section: "database"
priority: "optional"
maintainer: "Mario <mario@ora-tui.local>"
description: |
  Interactive Terminal User Interface (TUI), OpenTelemetry/Prometheus Exporter,
  SRE/SLO Engine (Telegram & SMTP Alerts), Remote Action API, and Flutter Web Command Center
  for Oracle RAC, Restart, Single Instance, ASM, RMAN, Data Guard, Alert Log, and Linux/SAN.
vendor: "ora-tui"
homepage: "https://github.com/mario-ezquerro/oratui"
license: "Apache-2.0"

contents:
  - src: ./bin/ora-tui-linux-amd64
    dst: /usr/bin/ora-tui
    file_info:
      mode: 0755
      owner: root
      group: root
  - src: ./packaging/sudoers.ora-tui
    dst: /etc/sudoers.d/ora-tui
    type: config|noreplace
    file_info:
      mode: 0440
      owner: root
      group: root
  - src: ./packaging/ora-tui-otel.service
    dst: /usr/lib/systemd/system/ora-tui-otel.service
    file_info:
      mode: 0644
      owner: root
      group: root
  - src: ./packaging/ora-tui-otel.service
    dst: /usr/share/ora-tui/ora-tui-otel.service
