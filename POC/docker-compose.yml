version: "3.8"

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: oratui-poc-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_poc_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: oratui-poc-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/oratui_fleet_overview.json
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_poc_data:/var/lib/grafana

  oratui-web:
    build:
      context: ./flutter-web
      dockerfile: Dockerfile
    image: oratui-flutter-web:latest
    container_name: oratui-poc-flutter-web
    restart: unless-stopped
    ports:
      - "${FLUTTER_WEB_PORT:-8088}:80"
    environment:
      - FLUTTER_WEB_USER=${FLUTTER_WEB_USER:-admin}
      - FLUTTER_WEB_PASSWORD=${FLUTTER_WEB_PASSWORD:-admin}
      - ORATUI_API_TOKEN=${ORATUI_API_TOKEN:-}
    volumes:
      - ./flutter-web/build/web/servers.json:/usr/share/nginx/html/servers.json:ro

volumes:
  prometheus_poc_data:
  grafana_poc_data:
