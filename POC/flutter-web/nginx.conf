server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Evitar cachear servers.json y auth-config.json para que los cambios de .env e inventario se apliquen al instante
    location ~ ^/(servers|auth-config)\.json$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
