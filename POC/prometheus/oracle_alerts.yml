groups:
  - name: oratui_oracle_and_server_alerts
    interval: 10s
    rules:
      # 0. Exporter Caído o Sin Respuesta
      - alert: OraTuiExporterDown
        expr: up{job=~"oracle-oratui.*"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Exporter ora-tui sin respuesta en {{ $labels.instance }}"
          description: "Prometheus no puede conectar con ora-tui (--opentelemetry) en {{ $labels.instance }}."

      # 1. Instancia Oracle Caída o Cerrada
      - alert: OracleInstanceDown
        expr: oratui_instance_up < 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instancia Oracle {{ $labels.instance }} en {{ $labels.host }} NO está OPEN"
          description: "La instancia {{ $labels.instance }} (BD {{ $labels.db_name }}) en el nodo {{ $labels.node }} está en estado {{ $labels.status }} / {{ $labels.open_mode }}."

      # 2. Nodo del Cluster o Demonio Clusterware Caído (CRS, CSSD, EVMD, ASM)
      - alert: OracleClusterDaemonDown
        expr: oratui_cluster_node_up == 0 or oratui_cluster_daemon_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Fallo de Clusterware / Demonio en nodo {{ $labels.node }}"
          description: "El nodo {{ $labels.node }} o su demonio {{ $labels.daemon }} está fuera de línea en el cluster {{ $labels.cluster }}."

      # 3. PDB Cerrada (MOUNTED)
      - alert: OraclePDBNotOpen
        expr: oratui_pdb_up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Pluggable Database (PDB) {{ $labels.pdb }} cerrada en {{ $labels.host }}"
          description: "La PDB {{ $labels.pdb }} se encuentra en modo {{ $labels.open_mode }}."

      # 4. Tablespace > 85% (Warning) y > 92% (Critical considerando AUTOEXTEND MAXBYTES)
      - alert: OracleTablespaceWarning
        expr: oratui_tablespace_used_percent >= 85 and oratui_tablespace_used_percent < 92
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tablespace {{ $labels.tablespace }} al {{ $value }}% en {{ $labels.host }}"
          description: "El tablespace {{ $labels.tablespace }} ha superado el 85% de su capacidad máxima real (AUTOEXTEND={{ $labels.autoextend }})."

      - alert: OracleTablespaceCritical
        expr: oratui_tablespace_used_percent >= 92
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "URGENTE: Tablespace {{ $labels.tablespace }} al {{ $value }}% (Riesgo ORA-01653/ORA-01654)"
          description: "El tablespace {{ $labels.tablespace }} en {{ $labels.host }} está casi lleno ({{ $value }}%). Añada un datafile o amplíe MAXSIZE."

      # 5. Fast Recovery Area (FRA) Llena (> 85%)
      - alert: OracleFRASpaceCritical
        expr: oratui_instance_fra_used_percent >= 85
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Fast Recovery Area (FRA) al {{ $value }}% en instancia {{ $labels.instance }}"
          description: "Riesgo de bloqueo de archivado (ORA-19809 / ORA-19815). Lance backup de Archivelogs con DELETE INPUT."

      # 6. Bloqueos de Sesión Activos (TX / TM Locks)
      - alert: OracleBlockingSessionsDetected
        expr: oratui_sessions_blocking_locks_total > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} sesiones bloqueantes (Locks TX/TM) en {{ $labels.host }}"
          description: "Existen sesiones bloqueando transacciones en {{ $labels.host }} durante más de 2 minutos."

      # 7. ASM Diskgroup Crítico o con Discos Offline
      - alert: OracleASMDiskgroupCritical
        expr: oratui_asm_diskgroup_used_percent >= 88 or oratui_asm_diskgroup_offline_disks > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Alerta en ASM Diskgroup {{ $labels.diskgroup }} en {{ $labels.host }}"
          description: "El Diskgroup ASM {{ $labels.diskgroup }} tiene uso {{ $value }}% o discos OFFLINE."

      # 8. Listener Oracle Caído
      - alert: OracleListenerDown
        expr: oratui_listener_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Listener Oracle {{ $labels.listener }} CAÍDO en {{ $labels.host }}"
          description: "El listener {{ $labels.listener }} ({{ $labels.endpoint }}) no responde."

      # 9. Errores ORA-* en el Alert Log
      - alert: OracleAlertLogORAError
        expr: oratui_alert_ora_errors_total > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} errores ORA-* detectados en el Alert Log de {{ $labels.host }}"
          description: "Revise el módulo 7 (Alert Log) en ora-tui o el panel de Grafana para ver el código ORA- exacto."

      # 10. Backup RMAN Fallido
      - alert: OracleRMANBackupFailed
        expr: oratui_rman_backup_status == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Fallo de Backup RMAN ({{ $labels.input_type }}) en {{ $labels.host }}"
          description: "El trabajo RMAN {{ $labels.session_key }} ({{ $labels.input_type }}) finalizó en estado {{ $labels.status }}."

      # 11. Data Guard Standby MRP0 Detenido o con Retraso (Lag > 300s)
      - alert: OracleDataGuardSyncIssue
        expr: oratui_dataguard_mrp_up == 0 or oratui_dataguard_apply_lag_seconds > 300
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Fallo o retraso en Standby Data Guard {{ $labels.standby_db }}"
          description: "MRP0 detenido o Apply Lag superior a 5 minutos en {{ $labels.standby_db }} ({{ $labels.standby_host }})."

      # 12. Servidor Linux: Carga CPU, RAM, Swap, THP o Kernel AIO en Warning/Critical
      - alert: LinuxServerHealthDegraded
        expr: oratui_os_metric_healthy == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Métrica de servidor Linux en alerta: {{ $labels.category }} - {{ $labels.component }} ({{ $labels.host }})"
          description: "El subsistema {{ $labels.component }} en {{ $labels.host }} reporta estado {{ $labels.status }}."

      # 13. Filesystem Lleno (> 90%) o Agotamiento de Inodos (> 85% -> Riesgo ORA-09925)
      - alert: LinuxFilesystemOrInodesCritical
        expr: oratui_filesystem_used_percent >= 90 or oratui_filesystem_inodes_used_percent >= 85
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Filesystem {{ $labels.mountpoint }} crítico en {{ $labels.host }} (Espacio o Inodos)"
          description: "El punto de montaje {{ $labels.mountpoint }} ({{ $labels.device }}) supera el umbral crítico de espacio o inodos (riesgo ORA-09925)."

      # 14. Pérdida de Camino SAN Multipath / HBA Fibre Channel / Disco de Bloque
      - alert: LinuxSANMultipathPathDown
        expr: oratui_storage_path_healthy == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Camino SAN Multipath o HBA degradado: {{ $labels.name }} en {{ $labels.host }}"
          description: "El dispositivo {{ $labels.name }} ({{ $labels.type }}) presenta caminos caídos: {{ $labels.paths_summary }}."

      # 15. Regresión de Plan SQL (SQL Plan Flip detectado en gv$sql)
      - alert: OracleSQLPlanFlipRegression
        expr: oratui_sql_plan_regression > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Regresión de Plan SQL (Plan Flip) en SQL_ID {{ $labels.sql_id }} ({{ $labels.host }})"
          description: "El SQL_ID {{ $labels.sql_id }} (esquema {{ $labels.schema }}) usa el PHV {{ $labels.current_phv }} en vez del óptimo {{ $labels.best_phv }}. Fije el plan en SQL Plan Baseline (DBMS_SPM)."

      # 16. Job de Negocio Fallido en las últimas 24h (DBMS_SCHEDULER / DBMS_JOB)
      - alert: OracleBusinessSchedulerJobFailed
        expr: oratui_scheduler_job_failed_24h > 0 or oratui_scheduler_job_healthy == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Job de negocio {{ $labels.owner }}.{{ $labels.job_name }} en estado {{ $labels.state }} ({{ $labels.host }})"
          description: "El job {{ $labels.owner }}.{{ $labels.job_name }} ({{ $labels.job_type }}) registra fallos en las últimas 24h."

      # 17. Latencia Elevada en RAC Cache Fusion Interconnect (> 2.5 ms)
      - alert: OracleRACCacheFusionHighLatency
        expr: oratui_rac_gc_cr_block_latency_ms > 2.5 or oratui_rac_gc_current_block_latency_ms > 2.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Alta latencia RAC Cache Fusion en instancia {{ $labels.instance }} ({{ $labels.host }})"
          description: "La transferencia de bloques Global Cache por el Interconnect ({{ $labels.interconnect_ip }}) supera 2.5 ms ({{ $value }} ms)."

      # 18. Latencia I/O Elevada en Datafile (> 15 ms lectura o > 20 ms escritura)
      - alert: OracleDatafileIOHighLatency
        expr: oratui_datafile_read_latency_ms > 15 or oratui_datafile_write_latency_ms > 20
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Alta latencia I/O en datafile {{ $labels.file_name }} ({{ $labels.tablespace }})"
          description: "El datafile {{ $labels.file_name }} en {{ $labels.host }} supera el umbral de latencia física ({{ $value }} ms)."

      # 19. Tormenta de Cambios de Redo Log (>= 12 switches/hora)
      - alert: OracleRedoLogSwitchStorm
        expr: oratui_redo_switches_last_hour >= 12
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Alta frecuencia de Redo Log Switches ({{ $value }}/h) en {{ $labels.host }}"
          description: "Se han producido {{ $value }} cambios de Redo Log en la última hora (recomendado <= 6/h). Amplíe el tamaño de los grupos de Online Redo Log."

      # 20. Errores ORA-01555 (Snapshot Too Old) en Undo Tablespace
      - alert: OracleUndoORA01555Detected
        expr: oratui_undo_ora01555_total > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Detectados {{ $value }} errores ORA-01555 (Snapshot Too Old) en {{ $labels.host }}"
          description: "v$undostat reporta {{ $value }} errores ORA-01555. Aumente UNDO_RETENTION o amplíe el tablespace UNDO."

      # 21. Degradación de Paralelismo (Parallel Query DOP Downgraded)
      - alert: OracleParallelQueryDOPDowngraded
        expr: oratui_px_downgraded_queries_total > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} consultas paralelas con DOP degradado en {{ $labels.host }}"
          description: "Existen consultas en gv$px_session ejecutándose con menor paralelismo (DOP) del solicitado por falta de esclavos PX."
