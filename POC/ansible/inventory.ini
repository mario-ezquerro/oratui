# ==============================================================================
# Inventario de Ansible para ora-tui:
#   1. [oracle_servers]    -> Instala/actualiza el binario ora-tui y el daemon
#                             systemd "ora-tui-otel" (puerto 9161).
#   2. [monitoring_server] -> Instala/mantiene Prometheus + Grafana con Docker
#                             y genera automáticamente la lista de servidores
#                             a monitorizar a partir de [oracle_servers].
# ==============================================================================

[oracle_servers]
# Ejemplos de servidores Oracle (sustituye por tus nombres de host o IPs reales):
ora-prod-rac01.local  ansible_host=192.168.10.11  env=PROD  cluster_label=rac-prod  otel_port=9161
ora-prod-rac02.local  ansible_host=192.168.10.12  env=PROD  cluster_label=rac-prod  otel_port=9161
ora-pre-db01.local    ansible_host=192.168.20.11  env=PRE   cluster_label=single-pre otel_port=9161
ora-des-db01.local    ansible_host=192.168.30.11  env=DES   cluster_label=single-des otel_port=9161

[monitoring_server]
# Máquina donde correrán los contenedores Docker de Prometheus (:9090) y Grafana (:3000)
monitor-server.local  ansible_host=192.168.10.100

[all:vars]
ansible_user=root
# Puerto por defecto del exportador OpenTelemetry/Prometheus de ora-tui
default_otel_port=9161
# Intervalo de recolección del daemon ora-tui en cada servidor Oracle
oratui_scrape_interval=10s
# Directorio en el servidor de monitorización donde se desplegará la POC
poc_install_dir=/opt/oratui-poc
# URL oficial de descarga de los paquetes precompilados desde GitHub
oratui_rpm_url=https://github.com/mario-ezquerro/oratui/raw/main/dist/ora-tui-1.6.0-1.x86_64.rpm
oratui_deb_url=https://github.com/mario-ezquerro/oratui/raw/main/dist/ora-tui_1.6.0-1_amd64.deb
